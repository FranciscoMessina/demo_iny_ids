<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="demo-token" content="__TOKEN__">
  <title>Laboratorio de inyección</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Laboratorio de inyección</h1>
      <p>El mismo ataque contra dos servidores: uno vulnerable y uno con buenas prácticas.</p>
    </div>
    <div class="score" id="score" aria-live="polite"></div>
    <button id="run-all" class="btn primary" type="button">Ejecutar todos los ataques</button>
  </header>

  <div class="layout">
    <nav id="nav" aria-label="Ataques"></nav>
    <main id="main"></main>
  </div>

  <footer>
    Solo con fines educativos. El servidor vulnerable ejecuta comandos reales en tu equipo: escucha únicamente en
    127.0.0.1 y exige un token generado al arrancar.
  </footer>
</body>
</html>
